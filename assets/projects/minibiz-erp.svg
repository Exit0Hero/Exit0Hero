<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" role="img" aria-label="MiniBiz ERP — AI-powered business intelligence platform">
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <linearGradient id="mb-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="820" height="160" rx="8" fill="url(#mb-bg)" stroke="#10B981" stroke-width="0.5" opacity="0.9"/>
  <rect x="0" y="0" width="820" height="2" rx="1" fill="url(#mb-accent)" opacity="0.7"/>
  <rect x="1" y="1" width="818" height="78" rx="7" fill="white" opacity="0.02"/>

  <circle cx="30" cy="30" r="5" fill="#10B981" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="34" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9" letter-spacing="1">BUILDING</text>

  <rect x="30" y="55" width="50" height="50" rx="8" fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="55" y="85" text-anchor="middle" fill="#10B981" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="16" font-weight="bold" opacity="0.7">MB</text>

  <text x="100" y="72" fill="#F3F4F6" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="18" font-weight="bold">MiniBiz ERP</text>

  <text x="100" y="92" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">AI-powered business intelligence platform that</text>
  <text x="100" y="106" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">turns accounting data into actionable insights.</text>

  <g transform="translate(100, 118)">
    <rect x="0" y="0" width="52" height="18" rx="9" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="26" y="13" text-anchor="middle" fill="#10B981" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">TS</text>

    <rect x="58" y="0" width="52" height="18" rx="9" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="84" y="13" text-anchor="middle" fill="#10B981" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">React</text>

    <rect x="116" y="0" width="35" height="18" rx="9" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="134" y="13" text-anchor="middle" fill="#10B981" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">AI</text>

    <rect x="157" y="0" width="52" height="18" rx="9" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="183" y="13" text-anchor="middle" fill="#10B981" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Prisma</text>
  </g>

  <g transform="translate(680, 60)">
