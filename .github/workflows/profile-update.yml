name: Validate Profile Assets

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify all image assets exist
        run: |
          REQUIRED_FILES=(
            "assets/hero-header.svg"
            "assets/positioning-banner.svg"
            "assets/tech-matrix.svg"
            "assets/stats-card.svg"
            "assets/terminal-log.svg"
            "assets/status-loop.svg"
            "assets/social-footer.svg"
            "assets/projects/schedule-ai.svg"
            "assets/projects/adapt-iq.svg"
            "assets/projects/interview-simulator.svg"
            "assets/projects/netflix-rec.svg"
            "assets/projects/minibiz-erp.svg"
          )

          echo "Validating profile assets..."
          FAILED=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              FAILED=1
            else
              SIZE=$(wc -c < "$file")
              echo "OK: $file (${SIZE} bytes)"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "ERROR: Required assets missing!"
            exit 1
          fi

          echo "All required assets verified."
