<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 420" role="img" aria-label="Karan Sasane — AI Systems Engineer with ASCII portrait and profile photo">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D0F12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbit-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF9E3B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF9E3B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="orbit-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="amber-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF9E3B" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="asc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <filter id="soft-shadow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="profile-clip">
      <circle cx="640" cy="155" r="72"/>
    </clipPath>

    <clipPath id="text-clip">
      <rect x="250" y="308" width="350" height="30"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" fill="#0D0F12"/>
  <rect width="850" height="420" fill="url(#bg-glow)"/>

  <!-- Grid -->
  <g opacity="0.035" stroke="#FF9E3B" stroke-width="0.5">
    <line x1="0" y1="40" x2="850" y2="40"/><line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/><line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="0" y1="280" x2="850" y2="280"/><line x1="0" y1="320" x2="850" y2="320"/>
    <line x1="0" y1="360" x2="850" y2="360"/><line x1="0" y1="400" x2="850" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="420"/><line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/><line x1="425" y1="0" x2="425" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/><line x1="650" y1="0" x2="650" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
  </g>

  <!-- HUD corners -->
  <g stroke="#FF9E3B" stroke-width="1.5" fill="none" opacity="0.3">
    <polyline points="20,20 20,40"/><polyline points="20,20 40,20"/>
    <polyline points="830,20 830,40"/><polyline points="830,20 810,20"/>
    <polyline points="20,400 20,380"/><polyline points="20,400 40,400"/>
    <polyline points="830,400 830,380"/><polyline points="830,400 810,400"/>
  </g>

  <!-- HUD data readouts -->
  <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" fill="#8E95A5" opacity="0.4">
    <text x="30" y="410">SYS.ID: 0x4558_4954</text>
    <text x="30" y="28">STATUS: OPERATIONAL</text>
    <text x="700" y="28">MODE: ENGINEERING</text>
    <text x="680" y="410">BUILD: 2026.09</text>
  </g>

  <!-- ============ LEFT: ASCII ART ============ -->
  <g transform="translate(30, 55)">
    <!-- ASCII frame bracket -->
    <g stroke="#FF9E3B" stroke-width="1" fill="none" opacity="0.2">
      <polyline points="-5,-5 -5,15"/><polyline points="-5,-5 15,-5"/>
      <polyline points="285,-5 285,15"/><polyline points="285,-5 265,-5"/>
      <polyline points="-5,360.0 -5,340.0"/>
      <polyline points="-5,360.0 15,360.0"/>
      <polyline points="285,360.0 285,340.0"/>
      <polyline points="285,360.0 265,360.0"/>
    </g>

    <!-- Label -->
    <text x="142" y="-10" text-anchor="middle" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" letter-spacing="2" opacity="0.5">ASCII_RENDER</text>

    <!-- ASCII art text -->
    <text font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11.5" fill="url(#asc-grad)" xml:space="preserve">
      <tspan x="0" dy="0">%%%%%%%%%%%%%%%#############%%%%%%%%%%%%%%%%</tspan>
      <tspan x="0" dy="11.5">%%%%%%%%##***++++++++++++++++++**##%%%%%%%%%</tspan>
      <tspan x="0" dy="11.5">%%%%##*++++++++++++++***++========++**#%%%%%</tspan>
      <tspan x="0" dy="11.5">%#**++++++++++++*#####%%##***++========+*#%%</tspan>
      <tspan x="0" dy="11.5">*+++++++++++###%%%%@@%%%%%%%###*+=========+*</tspan>
      <tspan x="0" dy="11.5">++++++++==+#%%%@%%%%%%%@@%%@%%%%#+==========</tspan>
      <tspan x="0" dy="11.5">++++++++**%%%%%@@@@@@@@@@@@%@@%%%#+=========</tspan>
      <tspan x="0" dy="11.5">++++++=*%%@@@@@@%#*++++++#%@@@@%%%##+=======</tspan>
      <tspan x="0" dy="11.5">+++++=+*%@@@@@%*+--::::::-=*%@@@%%%%*=-----=</tspan>
      <tspan x="0" dy="11.5">++++==*%%%@@@@*--:::::::::-=+%@@@@%%%#=-----</tspan>
      <tspan x="0" dy="11.5">++++++#%%@@@@*=+**+=----=---=#@@@@@@%%*-----</tspan>
      <tspan x="0" dy="11.5">+++=+#%@@@@@#+**##%*-=*###*++*@@@@@@%%*-----</tspan>
      <tspan x="0" dy="11.5">+++==*%@@@@%===+***=:-*####**+%@@@@@%%*=----</tspan>
      <tspan x="0" dy="11.5">+++==+#%@@@*::::==-::-========#@@@%%%%*-----</tspan>
      <tspan x="0" dy="11.5">++====+#%%#=-=++***=+*==-:::-=#@@@@%%%+-----</tspan>
      <tspan x="0" dy="11.5">++=====+%**==+#%**####*+*+===+#@@@@@%*------</tspan>
      <tspan x="0" dy="11.5">++======#+++++*#+---=+*%%*+++*%%%@@@%-------</tspan>
      <tspan x="0" dy="11.5">+========*##**+=-===-==+**+**##*#@@#=-------</tspan>
      <tspan x="0" dy="11.5">+=======-+%%###=-=**+===*###%%#%@@%=:-------</tspan>
      <tspan x="0" dy="11.5">+========-+%%%%###*****#%%%%%@@@%%#---------</tspan>
      <tspan x="0" dy="11.5">=========--==+%@@@@@@@@@@@@#*%@%*-----------</tspan>
      <tspan x="0" dy="11.5">=========-----+##%%%@@@%%#*+++=*-:----------</tspan>
      <tspan x="0" dy="11.5">==========----==+*#####*++==- =%*=----------</tspan>
      <tspan x="0" dy="11.5">========--=======+***+++++-. :#%%%*==-------</tspan>
      <tspan x="0" dy="11.5">========+**#-=#+=+++++++=:  :#%%%%%%%#*+=---</tspan>
      <tspan x="0" dy="11.5">====+*######..**++++++=:   .#%%%%#%%%%%%##*+</tspan>
      <tspan x="0" dy="11.5">+*##%%%###%+=:-++===-::.   +%%%%%%%%%%%%####</tspan>
      <tspan x="0" dy="11.5">#%%%%%%%#%#==-::---:..:-:.-%%%%%%%%%%%%%%###</tspan>
      <tspan x="0" dy="11.5">*#%%%%%%#%+:.....:=:.....:#%%%%%%%%%%%%%%%%%</tspan>
      <tspan x="0" dy="11.5">**#%%%%#%#:..... .::.....+%%%%%%%%%%%%%%%%%%</tspan>
    </text>

    <!-- Scan line -->
    <rect x="-5" width="295" height="1" fill="#FF9E3B" opacity="0.06">
      <animate attributeName="y" values="-5;360.0;-5" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ RIGHT: PROFILE PHOTO ============ -->
  <g filter="url(#soft-shadow)">
    <!-- Outer glow -->
    <circle cx="640" cy="155" r="90" fill="none" stroke="#FF9E3B" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="85;95;85" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit ring 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 640 155" to="360 640 155" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="640" cy="155" rx="100" ry="28" fill="none" stroke="url(#orbit-1)" stroke-width="1" opacity="0.35" transform="rotate(-20 640 155)"/>
      <circle cx="740" cy="145" r="2.5" fill="#FF9E3B" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit ring 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 640 155" to="0 640 155" dur="28s" repeatCount="indefinite"/>
      <ellipse cx="640" cy="155" rx="108" ry="32" fill="none" stroke="url(#orbit-2)" stroke-width="0.8" opacity="0.25" transform="rotate(15 640 155)"/>
      <circle cx="532" cy="165" r="2" fill="#00F2FE" opacity="0.5">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Pulsing inner ring -->
    <circle cx="640" cy="155" r="80" fill="none" stroke="#FF9E3B" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="76;84;76" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Photo circle -->
    <circle cx="640" cy="155" r="72" fill="#14171C" stroke="#FF9E3B" stroke-width="1" opacity="0.8"/>
    <image x="568" y="83" width="144" height="144" href="assets/profile-photo.png" clip-path="url(#profile-clip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="640" cy="155" r="72" fill="none" stroke="#0D0F12" stroke-width="6" opacity="0.3"/>

    <!-- Tech labels around photo -->
    <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7" fill="#8E95A5" opacity="0.35">
      <text x="525" y="105" text-anchor="end">AI/ML</text>
      <line x1="530" y1="103" x2="560" y2="118" stroke="#FF9E3B" stroke-width="0.5" opacity="0.3"/>
      <text x="755" y="105">PYTHON</text>
      <line x1="750" y1="103" x2="720" y2="118" stroke="#00F2FE" stroke-width="0.5" opacity="0.3"/>
      <text x="525" y="215" text-anchor="end">SYSTEMS</text>
      <line x1="530" y1="213" x2="560" y2="195" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
      <text x="755" y="215">DATA</text>
      <line x1="750" y1="213" x2="720" y2="195" stroke="#FF9E3B" stroke-width="0.5" opacity="0.3"/>
    </g>
  </g>

  <!-- ============ BOTTOM: NAME + TYPING ============ -->

  <!-- Name -->
  <text x="425" y="290" text-anchor="middle" fill="#F3F4F6" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="26" font-weight="bold" letter-spacing="4">KARAN SASANE</text>

  <!-- Accent line -->
  <line x1="270" y1="302" x2="580" y2="302" stroke="url(#amber-line)" stroke-width="1"/>

  <!-- Typing animation -->
  <g clip-path="url(#text-clip)">
    <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#FF9E3B" text-anchor="middle">
      <text x="425" y="322" opacity="0">
        AI Systems Engineer
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.07;0.13;0.15;1"/>
      </text>
      <text x="425" y="322" opacity="0">
        ML Pipelines
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.15;0.17;0.22;0.28;0.30;1"/>
      </text>
      <text x="425" y="322" opacity="0">
        Python Architect
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.30;0.32;0.37;0.43;0.45;1"/>
      </text>
      <text x="425" y="322" opacity="0">
        Data Systems Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.45;0.47;0.52;0.58;0.60;1"/>
      </text>
      <text x="425" y="322" opacity="0">
        Automation Engineer
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.60;0.62;0.67;0.73;0.75;1"/>
      </text>
      <text x="425" y="322" opacity="0">
        Problem Solver
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.75;0.77;0.82;0.88;0.90;1"/>
      </text>
    </g>
  </g>

  <!-- Blinking cursor -->
  <rect x="418" y="308" width="2" height="16" fill="#FF9E3B" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent dots -->
  <g opacity="0.4">
    <circle cx="395" cy="365" r="1.5" fill="#FF9E3B">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="365" r="1.5" fill="#FF6B35">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="365" r="1.5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="365" r="1.5" fill="#FF9E3B">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="365" r="1.5" fill="#FF6B35">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom divider line -->
  <line x1="0" y1="385" x2="850" y2="385" stroke="#30363D" stroke-width="0.5" opacity="0.3"/>
  <text x="425" y="405" text-anchor="middle" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" letter-spacing="2" opacity="0.3">I don&apos;t just use AI — I engineer systems around it.</text>

  <!-- Global scan line -->
  <rect width="850" height="1" fill="#FF9E3B" opacity="0.03">
    <animate attributeName="y" values="0;420;0" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>