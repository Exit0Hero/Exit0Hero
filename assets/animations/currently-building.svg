<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-label="Currently building: intelligent scheduling systems, AI/ML experiments, data-driven applications, automation workflows">
  <defs>
    <linearGradient id="cur-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="120" fill="#0B0F14"/>

  <!-- Title -->
  <text x="30" y="25" fill="#E6EDF3" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" font-weight="bold" letter-spacing="2">CURRENTLY BUILDING</text>
  <line x1="30" y1="33" x2="220" y2="33" stroke="url(#cur-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Pulsing indicator -->
  <circle cx="20" cy="55" r="4" fill="#3FB950" opacity="0.8">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Items -->
  <text x="35" y="55" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">
    <tspan fill="#58A6FF">→</tspan> intelligent scheduling systems
  </text>
  <text x="35" y="75" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">
    <tspan fill="#A371F7">→</tspan> AI/ML experiments
  </text>
  <text x="35" y="95" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">
    <tspan fill="#58A6FF">→</tspan> data-driven applications
  </text>
  <text x="350" y="55" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">
    <tspan fill="#A371F7">→</tspan> automation workflows
  </text>
  <text x="350" y="75" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">
    <tspan fill="#3FB950">→</tspan> real-world problem solving
  </text>
</svg>
