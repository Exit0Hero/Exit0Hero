<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Featured projects visualization: Schedule AI, Sentinel, AdaptIQ, Netflix Stats Explorer">
  <defs>
    <linearGradient id="proj-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="proj-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#0B0F14"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E6EDF3" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="16" font-weight="bold" letter-spacing="3">FEATURED PROJECTS</text>
  <line x1="300" y1="45" x2="500" y2="45" stroke="url(#proj-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Central hub -->
  <circle cx="400" cy="80" r="20" fill="none" stroke="#58A6FF" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="80" r="8" fill="#58A6FF" opacity="0.8"/>
  <text x="400" y="84" text-anchor="middle" fill="#0B0F14" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" font-weight="bold">P</text>

  <!-- Connection lines to projects -->
  <line x1="400" y1="100" x2="130" y2="170" stroke="#58A6FF" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="100" x2="330" y2="170" stroke="#A371F7" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="100" x2="470" y2="170" stroke="#58A6FF" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="100" x2="670" y2="170" stroke="#A371F7" stroke-width="1" opacity="0.3"/>

  <!-- Animated particles on connections -->
  <circle r="2" fill="#58A6FF" opacity="0.8">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M400,100 L130,170"/>
  </circle>
  <circle r="2" fill="#A371F7" opacity="0.8">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M400,100 L330,170"/>
  </circle>
  <circle r="2" fill="#58A6FF" opacity="0.8">
    <animateMotion dur="3.1s" repeatCount="indefinite" path="M400,100 L470,170"/>
  </circle>
  <circle r="2" fill="#A371F7" opacity="0.8">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M400,100 L670,170"/>
  </circle>

  <!-- Project Card 1: Schedule AI -->
  <g filter="url(#proj-glow)">
    <rect x="40" y="170" width="180" height="140" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="0.5" opacity="0.8"/>
    <rect x="40" y="170" width="180" height="3" rx="1.5" fill="#58A6FF" opacity="0.6"/>
    <text x="130" y="198" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" font-weight="bold">Schedule AI</text>
    <text x="130" y="218" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Intelligent Timetable</text>
    <text x="130" y="232" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Scheduling System</text>

    <!-- Tech tags -->
    <rect x="55" y="248" width="50" height="16" rx="3" fill="#58A6FF" opacity="0.15"/>
    <text x="80" y="260" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Python</text>
    <rect x="110" y="248" width="50" height="16" rx="3" fill="#A371F7" opacity="0.15"/>
    <text x="135" y="260" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">GA</text>
    <rect x="165" y="248" width="40" height="16" rx="3" fill="#3FB950" opacity="0.15"/>
    <text x="185" y="260" text-anchor="middle" fill="#3FB950" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">CSP</text>

    <!-- Status indicator -->
    <circle cx="60" cy="186" r="4" fill="#3FB950" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="189" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">BUILT</text>
  </g>

  <!-- Project Card 2: SENTINEL -->
  <g filter="url(#proj-glow)">
    <rect x="240" y="170" width="180" height="140" rx="6" fill="#161B22" stroke="#A371F7" stroke-width="0.5" opacity="0.8"/>
    <rect x="240" y="170" width="180" height="3" rx="1.5" fill="#A371F7" opacity="0.6"/>
    <text x="330" y="198" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" font-weight="bold">SENTINEL</text>
    <text x="330" y="218" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">AI Network Attack</text>
    <text x="330" y="232" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Forecasting System</text>

    <!-- Tech tags -->
    <rect x="255" y="248" width="50" height="16" rx="3" fill="#58A6FF" opacity="0.15"/>
    <text x="280" y="260" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Python</text>
    <rect x="310" y="248" width="50" height="16" rx="3" fill="#A371F7" opacity="0.15"/>
    <text x="335" y="260" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">ML</text>
    <rect x="365" y="248" width="45" height="16" rx="3" fill="#3FB950" opacity="0.15"/>
    <text x="388" y="260" text-anchor="middle" fill="#3FB950" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Graph</text>

    <circle cx="260" cy="186" r="4" fill="#FFBD2E" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="270" y="189" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">SIH 2024</text>
  </g>

  <!-- Project Card 3: AdaptIQ -->
  <g filter="url(#proj-glow)">
    <rect x="440" y="170" width="180" height="140" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="0.5" opacity="0.8"/>
    <rect x="440" y="170" width="180" height="3" rx="1.5" fill="#58A6FF" opacity="0.6"/>
    <text x="530" y="198" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" font-weight="bold">AdaptIQ</text>
    <text x="530" y="218" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Adaptive Learning</text>
    <text x="530" y="232" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">System with AI</text>

    <!-- Tech tags -->
    <rect x="455" y="248" width="55" height="16" rx="3" fill="#58A6FF" opacity="0.15"/>
    <text x="483" y="260" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">TS</text>
    <rect x="515" y="248" width="55" height="16" rx="3" fill="#A371F7" opacity="0.15"/>
    <text x="543" y="260" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">AI</text>
    <rect x="575" y="248" width="35" height="16" rx="3" fill="#3FB950" opacity="0.15"/>
    <text x="593" y="260" text-anchor="middle" fill="#3FB950" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">KG</text>

    <circle cx="460" cy="186" r="4" fill="#3FB950" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="470" y="189" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">BUILT</text>
  </g>

  <!-- Project Card 4: Netflix Stats -->
  <g filter="url(#proj-glow)">
    <rect x="640" y="170" width="140" height="140" rx="6" fill="#161B22" stroke="#A371F7" stroke-width="0.5" opacity="0.8"/>
    <rect x="640" y="170" width="140" height="3" rx="1.5" fill="#A371F7" opacity="0.6"/>
    <text x="710" y="198" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" font-weight="bold">Netflix</text>
    <text x="710" y="213" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" font-weight="bold">Stats</text>
    <text x="710" y="232" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Data Visualization</text>
    <text x="710" y="244" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9">Dashboard</text>

    <!-- Tech tags -->
    <rect x="650" y="258" width="40" height="16" rx="3" fill="#58A6FF" opacity="0.15"/>
    <text x="670" y="270" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Py</text>
    <rect x="695" y="258" width="70" height="16" rx="3" fill="#A371F7" opacity="0.15"/>
    <text x="730" y="270" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Streamlit</text>

    <circle cx="655" cy="186" r="4" fill="#3FB950" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="665" y="189" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">BUILT</text>
  </g>

  <!-- Flow arrows down -->
  <g opacity="0.4">
    <line x1="130" y1="315" x2="130" y2="350" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="330" y1="315" x2="330" y2="350" stroke="#A371F7" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="530" y1="315" x2="530" y2="350" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="710" y1="315" x2="710" y2="350" stroke="#A371F7" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- Result labels -->
  <text x="130" y="370" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">Optimize</text>
  <text x="330" y="370" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">Forecast</text>
  <text x="530" y="370" text-anchor="middle" fill="#58A6FF" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">Adapt</text>
  <text x="710" y="370" text-anchor="middle" fill="#A371F7" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">Visualize</text>

  <!-- Converging lines to bottom -->
  <line x1="130" y1="385" x2="400" y2="410" stroke="#3FB950" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="330" y1="385" x2="400" y2="410" stroke="#3FB950" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="530" y1="385" x2="400" y2="410" stroke="#3FB950" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="710" y1="385" x2="400" y2="410" stroke="#3FB950" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Bottom impact label -->
  <text x="400" y="415" text-anchor="middle" fill="#3FB950" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" letter-spacing="2">REAL WORLD IMPACT</text>
</svg>
