<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="ASCII art portrait of Karan Sasane">
  <defs>
    <linearGradient id="asc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>

  <rect width="520" height="340" fill="#0D0F12"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#FF9E3B" stroke-width="0.5">
    <line x1="0" y1="40" x2="520" y2="40"/><line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/><line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="200" x2="520" y2="200"/><line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="280" x2="520" y2="280"/><line x1="0" y1="320" x2="520" y2="320"/>
  </g>

  <!-- HUD corners -->
  <g stroke="#FF9E3B" stroke-width="1.5" fill="none" opacity="0.3">
    <polyline points="12,12 12,32"/><polyline points="12,12 32,12"/>
    <polyline points="508,12 508,32"/><polyline points="508,12 488,12"/>
    <polyline points="12,328 12,308"/><polyline points="12,328 32,328"/>
    <polyline points="508,328 508,308"/><polyline points="508,328 488,328"/>
  </g>

  <!-- Title -->
  <text x="260" y="32" text-anchor="middle" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9" letter-spacing="3">ASCII PORTRAIT</text>

  <!-- ASCII art in monospace -->
  <text font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="url(#asc-grad)" xml:space="preserve">
    <tspan x="10" dy="0">++++++++++++++++++++++++++++++++++++++++++++</tspan>
    <tspan x="10" dy="14">++++++++++++++++++++++++++++++++++++++++++++</tspan>
    <tspan x="10" dy="14">========+*++++++++=+++++==+=================</tspan>
    <tspan x="10" dy="14">-------=-.  ...... .::--=-------------------</tspan>
    <tspan x="10" dy="14">-----==:       .. -*+--.-=====---=----------</tspan>
    <tspan x="10" dy="14">-----=-::   :..   +###***+*+++==========+=--</tspan>
    <tspan x="10" dy="14">+++==+=-.   :-:.   :--+++++****+++++===+++==</tspan>
    <tspan x="10" dy="14">======+-    :=-..       .. :..=+=++*+****##*</tspan>
    <tspan x="10" dy="14">--:::--:  :. ..          ..:. :::++=+==---=*</tspan>
    <tspan x="10" dy="14">:.:::-==.:=:.::.        ........:++.-===+-.:</tspan>
    <tspan x="10" dy="14">..:-:=-++==-.. .               .=***++==:.:.</tspan>
    <tspan x="10" dy="14">:.::..-=+==-.     .. .     ..:+*#*******-.  </tspan>
    <tspan x="10" dy="14">-:-..--=+=-==:..  .      :=**###*********+= </tspan>
    <tspan x="10" dy="14">**+===-=+=--+*....    .=***#*************: :</tspan>
    <tspan x="10" dy="14">+++=:+==+==+##=....:-+*#**#****#*******=.  :</tspan>
    <tspan x="10" dy="14">++=..+++=+*###*  .-+##***#****####****-    .</tspan>
    <tspan x="10" dy="14">=++..::::++****=-*#**###***##*#*******.     </tspan>
    <tspan x="10" dy="14">==*+====+:-####%##*******************##*+-:.</tspan>
    <tspan x="10" dy="14">==+***+===*****####%%###***#######%%%#####*+</tspan>
    <tspan x="10" dy="14">===****+=#***********####%%%%%#####******+++</tspan>
    <tspan x="10" dy="14">===+**-.===-=--=+**#******************+==-++</tspan>
    <tspan x="10" dy="14">===+*++.:   .     .:--=+++++***++=--::..-:=+</tspan>
    <tspan x="10" dy="14">==+*-----::..             .:::..      .=-:-*</tspan>
    <tspan x="10" dy="14">**##:====::=-...      .....          .==-:-*</tspan>
  </text>

  <!-- Scan line -->
  <rect width="520" height="1" fill="#FF9E3B" opacity="0.04">
    <animate attributeName="y" values="0;340;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Label -->
  <text x="260" y="332" text-anchor="middle" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" letter-spacing="2" opacity="0.4">KARAN SASANE</text>
</svg>