<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" role="img" aria-label="Engineering philosophy: choosing the right technology to solve the actual problem">
  <defs>
    <linearGradient id="phi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="700" height="180" fill="#0B0F14"/>

  <!-- Left accent line -->
  <line x1="40" y1="30" x2="40" y2="150" stroke="url(#phi-grad)" stroke-width="2" opacity="0.4"/>

  <!-- Philosophy text -->
  <text x="60" y="55" fill="#E6EDF3" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" font-weight="bold" letter-spacing="1">ENGINEERING PHILOSOPHY</text>

  <text x="60" y="85" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11">
    Good software isn't about adding more technology.
  </text>
  <text x="60" y="105" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11">
    It's about choosing the right combination
  </text>
  <text x="60" y="125" fill="#E6EDF3" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" font-weight="bold">
    to solve the actual problem.
  </text>

  <!-- Small animated system diagram on the right -->
  <g transform="translate(520, 50)">
    <!-- Node 1 -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#58A6FF" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#58A6FF" opacity="0.7"/>

    <!-- Connection -->
    <line x1="10" y1="0" x2="40" y2="30" stroke="#58A6FF" stroke-width="1" opacity="0.3"/>
    <circle r="1.5" fill="#58A6FF" opacity="0.6">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M10,0 L40,30"/>
    </circle>

    <!-- Node 2 -->
    <circle cx="50" cy="30" r="10" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;12;8" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="30" r="4" fill="#A371F7" opacity="0.7"/>

    <!-- Connection -->
    <line x1="60" y1="30" x2="90" y2="0" stroke="#A371F7" stroke-width="1" opacity="0.3"/>
    <circle r="1.5" fill="#A371F7" opacity="0.6">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M60,30 L90,0"/>
    </circle>

    <!-- Node 3 -->
    <circle cx="100" cy="0" r="10" fill="none" stroke="#3FB950" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;12;8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="0" r="4" fill="#3FB950" opacity="0.7"/>

    <!-- Labels -->
    <text x="0" y="25" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">Problem</text>
    <text x="50" y="55" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">Right Tech</text>
    <text x="100" y="25" text-anchor="middle" fill="#8B949E" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7">Solution</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="1.5" fill="#58A6FF" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="150" r="1.5" fill="#A371F7" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
