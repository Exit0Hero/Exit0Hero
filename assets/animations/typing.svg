<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" role="img" aria-label="Rotating roles: AI/ML Engineer, Data Analyst, Python Developer, and more">
  <defs>
    <linearGradient id="type-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="50" fill="#0B0F14"/>

  <!-- Rotating text roles with clip-path animation -->
  <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="16" fill="url(#type-grad)" text-anchor="middle">
    <!-- Role 1 -->
    <text x="300" y="30" opacity="0">
      AI/ML Engineer in the making
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.02;0.07;0.12;0.14;1"/>
    </text>
    <!-- Role 2 -->
    <text x="300" y="30" opacity="0">
      Data Analyst
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.14;0.16;0.21;0.26;0.28;1"/>
    </text>
    <!-- Role 3 -->
    <text x="300" y="30" opacity="0">
      Python Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.28;0.30;0.35;0.40;0.42;1"/>
    </text>
    <!-- Role 4 -->
    <text x="300" y="30" opacity="0">
      Machine Learning Builder
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.42;0.44;0.49;0.54;0.56;1"/>
    </text>
    <!-- Role 5 -->
    <text x="300" y="30" opacity="0">
      Automation Enthusiast
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.56;0.58;0.63;0.68;0.70;1"/>
    </text>
    <!-- Role 6 -->
    <text x="300" y="30" opacity="0">
      System Designer
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.70;0.72;0.77;0.82;0.84;1"/>
    </text>
    <!-- Role 7 -->
    <text x="300" y="30" opacity="0">
      Problem Solver
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="14s" repeatCount="indefinite" keyTimes="0.84;0.86;0.91;0.96;0.98;1"/>
    </text>
  </g>

  <!-- Underline accent -->
  <line x1="180" y1="38" x2="420" y2="38" stroke="url(#type-grad)" stroke-width="1" opacity="0.3"/>
</svg>
