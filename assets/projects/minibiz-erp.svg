  </g>

  <g stroke="#10B981" stroke-width="1" fill="none" opacity="0.2">
    <polyline points="8,8 8,20"/><polyline points="8,8 20,8"/>
    <polyline points="812,8 812,20"/><polyline points="812,8 800,8"/>
    <polyline points="8,152 8,140"/><polyline points="8,152 20,152"/>
    <polyline points="812,152 812,140"/><polyline points="812,152 800,152"/>
