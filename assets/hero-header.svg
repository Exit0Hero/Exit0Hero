<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" role="img" aria-label="Karan Sasane — AI Systems Engineer">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D0F12" stop-opacity="0"/>
    </radialGradient>

    <!-- Profile mask fade -->
    <radialGradient id="profile-fade" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <mask id="profile-mask">
      <rect width="850" height="340" fill="black"/>
      <circle cx="425" cy="140" r="90" fill="url(#profile-fade)"/>
    </mask>

    <!-- Orbit ring gradient -->
    <linearGradient id="orbit-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF9E3B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF9E3B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="orbit-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Amber accent gradient -->
    <linearGradient id="amber-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E3B" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF9E3B" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00F2FE" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing text clip -->
    <clipPath id="text-clip">
      <rect x="200" y="222" width="450" height="30"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="850" height="340" fill="#0D0F12"/>
  <rect width="850" height="340" fill="url(#bg-glow)"/>

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#FF9E3B" stroke-width="0.5">
    <line x1="0" y1="40" x2="850" y2="40"/><line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/><line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="0" y1="280" x2="850" y2="280"/><line x1="0" y1="320" x2="850" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="340"/><line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/><line x1="425" y1="0" x2="425" y2="340"/>
    <line x1="550" y1="0" x2="550" y2="340"/><line x1="650" y1="0" x2="650" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
  </g>

  <!-- HUD bracket corners -->
  <g stroke="#FF9E3B" stroke-width="1.5" fill="none" opacity="0.3">
    <!-- Top-left -->
    <polyline points="20,20 20,40"/>
    <polyline points="20,20 40,20"/>
    <!-- Top-right -->
    <polyline points="830,20 830,40"/>
    <polyline points="830,20 810,20"/>
    <!-- Bottom-left -->
    <polyline points="20,320 20,300"/>
    <polyline points="20,320 40,320"/>
    <!-- Bottom-right -->
    <polyline points="830,320 830,300"/>
    <polyline points="830,320 810,320"/>
  </g>

  <!-- HUD data readouts -->
  <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" fill="#8E95A5" opacity="0.5">
    <text x="30" y="330">SYS.ID: 0x4558_4954</text>
    <text x="30" y="28">STATUS: OPERATIONAL</text>
    <text x="700" y="28">MODE: ENGINEERING</text>
    <text x="680" y="330">BUILD: 2026.09</text>
  </g>

  <!-- Profile image slot — gradient circle with HUD rings -->
  <g filter="url(#soft-shadow)">
    <!-- Outer glow ring -->
    <circle cx="425" cy="140" r="100" fill="none" stroke="#FF9E3B" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="95;105;95" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating orbit ring 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 140" to="360 425 140" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="425" cy="140" rx="110" ry="30" fill="none" stroke="url(#orbit-1)" stroke-width="1" opacity="0.4" transform="rotate(-20 425 140)"/>
      <circle cx="535" cy="130" r="3" fill="#FF9E3B" opacity="0.7">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rotating orbit ring 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 425 140" to="0 425 140" dur="28s" repeatCount="indefinite"/>
      <ellipse cx="425" cy="140" rx="120" ry="35" fill="none" stroke="url(#orbit-2)" stroke-width="0.8" opacity="0.3" transform="rotate(15 425 140)"/>
      <circle cx="305" cy="150" r="2.5" fill="#00F2FE" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Pulsing inner ring -->
    <circle cx="425" cy="140" r="92" fill="none" stroke="#FF9E3B" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="88;96;88" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Profile placeholder circle -->
    <circle cx="425" cy="140" r="82" fill="#14171C" stroke="#FF9E3B" stroke-width="1" opacity="0.8"/>
    <circle cx="425" cy="140" r="82" fill="#FF9E3B" opacity="0.05"/>

    <!-- Initials placeholder -->
    <text x="425" y="135" text-anchor="middle" fill="#FF9E3B" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="32" font-weight="bold" opacity="0.6">KS</text>
    <text x="425" y="158" text-anchor="middle" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8" letter-spacing="2">PROFILE</text>

    <!-- Tech data points around profile -->
    <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7" fill="#8E95A5" opacity="0.4">
      <text x="310" y="90" text-anchor="end">AI/ML</text>
      <line x1="315" y1="88" x2="345" y2="105" stroke="#FF9E3B" stroke-width="0.5" opacity="0.3"/>
      <text x="540" y="90">PYTHON</text>
      <line x1="535" y1="88" x2="505" y2="105" stroke="#00F2FE" stroke-width="0.5" opacity="0.3"/>
      <text x="310" y="200" text-anchor="end">SYSTEMS</text>
      <line x1="315" y1="198" x2="345" y2="180" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
      <text x="540" y="200">DATA</text>
      <line x1="535" y1="198" x2="505" y2="180" stroke="#FF9E3B" stroke-width="0.5" opacity="0.3"/>
    </g>
  </g>

  <!-- Name -->
  <text x="425" y="270" text-anchor="middle" fill="#F3F4F6" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="26" font-weight="bold" letter-spacing="4">KARAN SASANE</text>

  <!-- Accent line under name -->
  <line x1="280" y1="282" x2="570" y2="282" stroke="url(#amber-line)" stroke-width="1"/>

  <!-- Typing animation area -->
  <g clip-path="url(#text-clip)">
    <g font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#FF9E3B" text-anchor="middle">
      <!-- Title 1 -->
      <text x="425" y="242" opacity="0">
        AI Systems Engineer
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.07;0.13;0.15;1"/>
      </text>
      <!-- Title 2 -->
      <text x="425" y="242" opacity="0">
        ML Pipelines
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.15;0.17;0.22;0.28;0.30;1"/>
      </text>
      <!-- Title 3 -->
      <text x="425" y="242" opacity="0">
        Python Architect
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.30;0.32;0.37;0.43;0.45;1"/>
      </text>
      <!-- Title 4 -->
      <text x="425" y="242" opacity="0">
        Data Systems Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.45;0.47;0.52;0.58;0.60;1"/>
      </text>
      <!-- Title 5 -->
      <text x="425" y="242" opacity="0">
        Automation Engineer
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.60;0.62;0.67;0.73;0.75;1"/>
      </text>
      <!-- Title 6 -->
      <text x="425" y="242" opacity="0">
        Problem Solver
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0.75;0.77;0.82;0.88;0.90;1"/>
      </text>
    </g>
  </g>

  <!-- Blinking cursor -->
  <rect x="418" y="228" width="2" height="16" fill="#FF9E3B" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent dots -->
  <g opacity="0.4">
    <circle cx="395" cy="300" r="1.5" fill="#FF9E3B">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="300" r="1.5" fill="#FF6B35">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="300" r="1.5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="300" r="1.5" fill="#FF9E3B">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="300" r="1.5" fill="#FF6B35">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Scan line -->
  <rect width="850" height="1" fill="#FF9E3B" opacity="0.03">
    <animate attributeName="y" values="0;340;0" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
