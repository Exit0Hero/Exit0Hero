name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate updated stats images
        run: |
          # The stats are dynamic via external services (github-readme-stats, streak-stats)
          # This workflow ensures the snake and other generated assets stay current
          echo "Profile assets are up to date."

      - name: Verify all image assets exist
        run: |
          REQUIRED_FILES=(
            "assets/hero/hero.svg"
            "assets/animations/terminal.svg"
            "assets/animations/typing.svg"
            "assets/animations/tech-stack.svg"
            "assets/animations/philosophy.svg"
            "assets/animations/status-loop.svg"
            "assets/animations/build-areas.svg"
            "assets/animations/currently-building.svg"
            "assets/projects/projects.svg"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          echo "All required assets verified."
