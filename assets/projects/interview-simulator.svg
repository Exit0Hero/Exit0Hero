<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" role="img" aria-label="Interview Simulator — AI-powered mock interviews">
  <defs>
    <linearGradient id="is-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <linearGradient id="is-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
  </defs>

  <rect width="820" height="160" rx="8" fill="url(#is-bg)" stroke="#FF6B35" stroke-width="0.5" opacity="0.9"/>
  <rect x="0" y="0" width="820" height="2" rx="1" fill="url(#is-accent)" opacity="0.7"/>
  <rect x="1" y="1" width="818" height="78" rx="7" fill="white" opacity="0.02"/>

  <circle cx="30" cy="30" r="5" fill="#FF6B35" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="34" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="9" letter-spacing="1">BUILT</text>

  <rect x="30" y="55" width="50" height="50" rx="8" fill="#FF6B35" opacity="0.08" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="55" y="85" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="16" font-weight="bold" opacity="0.7">IS</text>

  <text x="100" y="72" fill="#F3F4F6" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="18" font-weight="bold">Interview Simulator</text>

  <text x="100" y="92" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">AI-powered mock interview system with customizable</text>
  <text x="100" y="106" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10">questions, time tracking, and performance summaries.</text>

  <g transform="translate(100, 118)">
    <rect x="0" y="0" width="52" height="18" rx="9" fill="#FF6B35" opacity="0.1" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="26" y="13" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Python</text>

    <rect x="58" y="0" width="35" height="18" rx="9" fill="#FF6B35" opacity="0.1" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="76" y="13" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">AI</text>

    <rect x="99" y="0" width="52" height="18" rx="9" fill="#FF6B35" opacity="0.1" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="125" y="13" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">NLP</text>

    <rect x="157" y="0" width="56" height="18" rx="9" fill="#FF6B35" opacity="0.1" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="185" y="13" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="8">Speech</text>
  </g>

  <g transform="translate(680, 60)">
    <rect x="0" y="0" width="110" height="32" rx="6" fill="#FF6B35" opacity="0.1" stroke="#FF6B35" stroke-width="1"/>
    <text x="55" y="20" text-anchor="middle" fill="#FF6B35" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" font-weight="bold">VIEW →</text>
  </g>

  <g stroke="#FF6B35" stroke-width="1" fill="none" opacity="0.2">
    <polyline points="8,8 8,20"/><polyline points="8,8 20,8"/>
    <polyline points="812,8 812,20"/><polyline points="812,8 800,8"/>
    <polyline points="8,152 8,140"/><polyline points="8,152 20,152"/>
    <polyline points="812,152 812,140"/><polyline points="812,152 800,152"/>
  </g>

  <text x="770" y="150" text-anchor="end" fill="#8E95A5" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="7" opacity="0.3">PRJ.003</text>
</svg>
